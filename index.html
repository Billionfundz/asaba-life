<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASABA LIFE</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b9e8;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{
  position:relative;
  width:100%;
  height:100%;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#hud{
  position:absolute;
  top:12px;
  left:12px;
  z-index:10;
  background:#111c;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}
#money{color:#65ff78}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ffffff25;
  border:2px solid #ffffff55;
  z-index:20;
}
#stick{
  position:absolute;
  left:37px;
  top:37px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffffaa;
}

#action{
  position:absolute;
  right:25px;
  bottom:35px;
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid white;
  background:#111c;
  color:white;
  font-weight:bold;
  z-index:20;
}

#tip{
  position:absolute;
  top:12px;
  right:12px;
  color:white;
  background:#111c;
  padding:8px 10px;
  border-radius:10px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    🇳🇬 ASABA LIFE<br>
    💰 ₦<span id="money">5000</span>
  </div>

  <div id="tip">Explore Asaba</div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="action">ACTION</button>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9e8);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0,8,12);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.getElementById("game").prepend(renderer.domElement);

/* LIGHT */

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

/* GROUND */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshStandardMaterial({
    color:0x69a957
  })
);

ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ROADS */

function road(x,z,w,d){

  const r = new THREE.Mesh(
    new THREE.BoxGeometry(w,0.08,d),
    new THREE.MeshStandardMaterial({
      color:0x454545
    })
  );

  r.position.set(x,0.04,z);

  scene.add(r);
}

road(0,0,300,14);
road(0,0,14,300);
road(0,50,300,10);
road(60,0,10,300);

/* BUILDINGS */

function building(x,z,w,h,d,color){

  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:color
    })
  );

  b.position.set(x,h/2,z);
  scene.add(b);

  /* roof */

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w+0.3,0.4,d+0.3),
    new THREE.MeshStandardMaterial({
      color:0x55352a
    })
  );

  roof.position.set(x,h+0.2,z);
  scene.add(roof);
}

/* CITY */

building(-25,-25,12,9,12,0xd18a58);
building(25,-25,15,12,13,0xc87858);
building(-30,25,14,10,12,0xd2a45c);
building(30,25,13,8,14,0xb96d55);

building(-65,-20,18,14,15,0xc68b5a);
building(65,20,18,11,16,0xd09a5c);

building(-70,65,20,13,18,0xb8755a);
building(70,-65,22,15,18,0xc88458);

/* PLAYER */

const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.45,1.2,6,12),
  new THREE.MeshStandardMaterial({
    color:0x222222
  })
);

player.position.set(0,1,10);
scene.add(player);

/* PLAYER HEAD */

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.42,16,16),
  new THREE.MeshStandardMaterial({
    color:0x9b6044
  })
);

head.position.y = 1.15;
player.add(head);

/* MOVEMENT */

let moveX = 0;
let moveZ = 0;

function movePlayer(){

  player.position.x += moveX * 0.12;
  player.position.z += moveZ * 0.12;

  player.position.x =
    Math.max(-140,Math.min(140,player.position.x));

  player.position.z =
    Math.max(-140,Math.min(140,player.position.z));
}

/* CAMERA */

function updateCamera(){

  const target = new THREE.Vector3(
    player.position.x,
    player.position.y,
    player.position.z
  );

  const desired = new THREE.Vector3(
    player.position.x,
    player.position.y + 7,
    player.position.z + 11
  );

  camera.position.lerp(desired,0.08);

  camera.lookAt(target);
}

/* JOYSTICK */

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let active = false;

function joystickMove(e){

  if(!active)return;

  const rect = joystick.getBoundingClientRect();

  const centerX =
    rect.left + rect.width/2;

  const centerY =
    rect.top + rect.height/2;

  let dx = e.clientX-centerX;
  let dy = e.clientY-centerY;

  const max = 45;

  const distance =
    Math.sqrt(dx*dx+dy*dy);

  if(distance > max){

    dx = dx/distance*max;
    dy = dy/distance*max;

  }

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;

  moveX = dx/max;
  moveZ = dy/max;
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    active=true;
    joystick.setPointerCapture(e.pointerId);
    joystickMove(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    joystickMove(e);
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    active=false;
    moveX=0;
    moveZ=0;
    stick.style.transform="translate(0,0)";
  }
);

joystick.addEventListener(
  "pointercancel",
  ()=>{
    active=false;
    moveX=0;
    moveZ=0;
    stick.style.transform="translate(0,0)";
  }
);

/* ACTION */

document
.getElementById("action")
.addEventListener("click",()=>{

  const money =
    document.getElementById("money");

  money.textContent =
    Number(money.textContent)+100;

});

/* GAME LOOP */

function animate(){

  requestAnimationFrame(animate);

  movePlayer();
  updateCamera();

  renderer.render(scene,camera);
}

animate();

/* RESIZE */

window.addEventListener("resize",()=>{

  camera.aspect =
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>

</body>
</html>

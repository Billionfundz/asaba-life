<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASABA LIFE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9e8;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{
 position:absolute;top:12px;left:12px;z-index:10;
 padding:10px 14px;border-radius:12px;
 background:#111c;color:white;font-weight:bold;
 border:1px solid #ffffff33
}
#hud span{color:#72ff80}
#help{
 position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
 background:#111c;color:white;padding:9px 13px;border-radius:10px;
 font-size:13px;text-align:center
}
</style>
</head>

<body>
<div id="game">
  <div id="hud">
    🇳🇬 ASABA LIFE<br>
    💰 ₦<span id="money">5000</span>
  </div>

  <div id="help">
    Use <b>W A S D</b> or the arrow keys to move
  </div>
</div>

<script>
const game=document.getElementById("game");
const money=document.getElementById("money");

/*
  Simple browser 3D-style engine.
  We are starting with a lightweight perspective
  world so the game can run on phones.
*/

const canvas=document.createElement("canvas");
game.insertBefore(canvas,game.firstChild);
const ctx=canvas.getContext("2d");

let W=0,H=0;
let player={x:0,y:0};
let keys={};

const buildings=[
 {x:-260,y:180,w:180,h:130,c:"#c98b55"},
 {x:180,y:220,w:190,h:140,c:"#d2a05d"},
 {x:-430,y:-250,w:220,h:150,c:"#b87954"},
 {x:250,y:-300,w:210,h:160,c:"#c77a5a"},
 {x:-80,y:430,w:240,h:150,c:"#d1b05d"},
 {x:400,y:400,w:190,h:140,c:"#a86c55"}
];

function resize(){
 W=canvas.width=window.innerWidth;
 H=canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function move(){
 const speed=4;

 if(keys["w"]||keys["arrowup"])player.y-=speed;
 if(keys["s"]||keys["arrowdown"])player.y+=speed;
 if(keys["a"]||keys["arrowleft"])player.x-=speed;
 if(keys["d"]||keys["arrowright"])player.x+=speed;
}

function project(x,y,z){
 const scale=500/(z+500);
 return {
   x:W/2+x*scale,
   y:H/2+y*scale,
   scale
 };
}

function drawGround(){
 ctx.fillStyle="#72a95b";
 ctx.fillRect(0,0,W,H);

 const horizon=H*0.45;

 ctx.fillStyle="#555";
 ctx.fillRect(0,horizon,W,H-horizon);

 ctx.strokeStyle="#777";
 ctx.lineWidth=3;

 for(let i=-10;i<=10;i++){
   ctx.beginPath();
   ctx.moveTo(W/2+i*80,horizon);
   ctx.lineTo(W/2+i*180,H);
   ctx.stroke();
 }

 for(let y=horizon;y<H;y+=45){
   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(W,y);
   ctx.stroke();
 }
}

function drawBuilding(b){
 const z=b.y-player.y+700;
 if(z<80)return;

 const p=project(b.x-player.x,b.y-player.y,z);

 const w=b.w*p.scale;
 const h=b.h*p.scale;

 const x=p.x-w/2;
 const y=p.y-h;

 ctx.fillStyle="#0004";
 ctx.fillRect(x+8,y+10,w,h);

 ctx.fillStyle=b.c;
 ctx.fillRect(x,y,w,h);

 ctx.fillStyle="#ead8a0";

 const windows=Math.max(2,Math.floor(w/45));

 for(let i=0;i<windows;i++){
   const wx=x+15+i*(w-30)/windows;
   ctx.fillRect(wx,y+25,18*p.scale,22*p.scale);
   ctx.fillRect(wx,y+65,18*p.scale,22*p.scale);
 }
}

function drawPlayer(){
 const px=W/2;
 const py=H*0.68;

 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(px,py+20,22,9,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#222";
 ctx.fillRect(px-15,py-10,30,35);

 ctx.fillStyle="#b97855";
 ctx.beginPath();
 ctx.arc(px,py-22,13,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(px,py-28,14,Math.PI,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="white";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.fillText("PLAYER",px,py+52);
}

function loop(){
 move();

 ctx.clearRect(0,0,W,H);

 drawGround();

 buildings
   .slice()
   .sort((a,b)=>(b.y-player.y)-(a.y-player.y))
   .forEach(drawBuilding);

 drawPlayer();

 requestAnimationFrame(loop);
}

loop();
</script>
</body>
  </html>
